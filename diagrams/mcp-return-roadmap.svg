<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" viewBox="0 0 1500 1100" role="img" aria-labelledby="title desc">
  <title id="title">MCP return implementation roadmap</title>
  <desc id="desc">Eight staged phases to restore, verify, implement, test, and roll out read-only EMS MCP integration.</desc>
  <defs><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172b3a}.title{font-size:30px;font-weight:700}.sub{font-size:15px;fill:#526675}.box{fill:#fff;stroke:#198987;stroke-width:2}.num{fill:#198987}.numText{font-size:18px;font-weight:700;fill:#fff}.head{font-size:17px;font-weight:700}.body{font-size:13px;fill:#526675}.line{stroke:#708792;stroke-width:2;fill:none}.arrow{fill:#708792}.exit{fill:#eef7f5;stroke:#b8dcd5;stroke-width:1.5}.exitTitle{font-size:14px;font-weight:700;fill:#176d67}.exitText{font-size:12px;fill:#42615f}</style></defs>
  <rect width="1500" height="1100" fill="#f7fafb"/><text x="40" y="50" class="title">MCP return roadmap</text><text x="40" y="77" class="sub">Restore read-only data access in stages; preserve sandbox fallback and verify every measurement before the LLM explains it.</text>
  <!-- connectors -->
  <path d="M750 190V225" class="line"/><path d="M750 225L744 214H756Z" class="arrow"/>
  <path d="M750 330V365" class="line"/><path d="M750 365L744 354H756Z" class="arrow"/>
  <path d="M750 470V505" class="line"/><path d="M750 505L744 494H756Z" class="arrow"/>
  <path d="M750 610V645" class="line"/><path d="M750 645L744 634H756Z" class="arrow"/>
  <path d="M750 750V785" class="line"/><path d="M750 785L744 774H756Z" class="arrow"/>
  <path d="M750 890V925" class="line"/><path d="M750 925L744 914H756Z" class="arrow"/>
  <path d="M750 1030V1050" class="line"/>
  <g transform="translate(250 105)"><rect width="1000" height="85" rx="10" class="box"/><circle cx="42" cy="42" r="25" class="num"/><text x="36" y="49" class="numText">0</text><text x="85" y="34" class="head">MCP readiness</text><text x="85" y="59" class="body">Restore endpoint, network path, credentials, and DaxView availability; keep sandbox mode usable.</text></g>
  <g transform="translate(250 245)"><rect width="1000" height="85" rx="10" class="box"/><circle cx="42" cy="42" r="25" class="num"/><text x="36" y="49" class="numText">1</text><text x="85" y="34" class="head">Discover tools and contracts</text><text x="85" y="59" class="body">Capture tool names, input/output schemas, error codes, limits, and version from the live server.</text></g>
  <g transform="translate(250 385)"><rect width="1000" height="85" rx="10" class="box"/><circle cx="42" cy="42" r="25" class="num"/><text x="36" y="49" class="numText">2</text><text x="85" y="34" class="head">Verify schema and metric catalog</text><text x="85" y="59" class="body">Map device metrics to correct source, unit, interval, aggregation, value mode, timezone, and coverage.</text></g>
  <g transform="translate(250 525)"><rect width="1000" height="85" rx="10" class="box"/><circle cx="42" cy="42" r="25" class="num"/><text x="36" y="49" class="numText">3</text><text x="85" y="34" class="head">Map intent to bounded data operations</text><text x="85" y="59" class="body">Select site, device, or alarm operation; resolve ambiguous site/device/period with a follow-up.</text></g>
  <g transform="translate(250 665)"><rect width="1000" height="85" rx="10" class="box"/><circle cx="42" cy="42" r="25" class="num"/><text x="36" y="49" class="numText">4</text><text x="85" y="34" class="head">Enforce authorization and validate payloads</text><text x="85" y="59" class="body">Check scope, arguments, timestamps, units, sample count, coverage, and structured errors; fail closed.</text></g>
  <g transform="translate(250 805)"><rect width="1000" height="85" rx="10" class="box"/><circle cx="42" cy="42" r="25" class="num"/><text x="36" y="49" class="numText">5</text><text x="85" y="34" class="head">Add deterministic EMS calculations</text><text x="85" y="59" class="body">Test energy totals, extrema, demand, ranking, percentage comparisons, and data-quality rules.</text></g>
  <g transform="translate(250 945)"><rect width="1000" height="85" rx="10" class="box"/><circle cx="42" cy="42" r="25" class="num"/><text x="36" y="49" class="numText">6–8</text><text x="85" y="34" class="head">LLM explanation, end-to-end tests, controlled rollout</text><text x="85" y="59" class="body">Return verified prose plus typed chart/report JSON; validate against DaxView, then stage and monitor rollout.</text></g>
  <rect x="250" y="1050" width="1000" height="35" rx="8" class="exit"/><text x="270" y="1073" class="exitTitle">Every phase has an exit check; retain sandbox/rollback until correctness and access controls are proven.</text>
</svg>
