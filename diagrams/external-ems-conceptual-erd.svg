<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual external EMS data ERD</title>
  <desc id="desc">Conceptual Crow's Foot model of DaxView sites, devices, configured metrics, telemetry and alarms exposed through MCP. Not a verified physical schema.</desc>
  <defs><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172b3a}.title{font-size:29px;font-weight:700}.sub{font-size:15px;fill:#526675}.entity{fill:#fff;stroke:#2578a2;stroke-width:2}.head{fill:#eaf3fb}.name{font-size:17px;font-weight:700}.field{font-size:13px}.key{font-weight:700;fill:#176b99}.rel{stroke:#66808a;stroke-width:2;fill:none}.card{font-size:13px;font-weight:700;fill:#a04b26}.note{font-size:14px;fill:#526675}.banner{fill:#fff4df;stroke:#edbe62;stroke-width:1.5}</style><marker id="many" markerWidth="12" markerHeight="14" refX="10" refY="7" orient="auto"><path d="M1 1L10 7L1 13M1 7L10 7" fill="none" stroke="#66808a" stroke-width="1.5"/></marker></defs>
  <rect width="1500" height="920" fill="#fff"/>
  <text x="40" y="48" class="title">External EMS data exposed through MCP</text>
  <text x="40" y="74" class="sub">Conceptual logical model · Crow's Foot-style cardinalities · confirm every table, key, and constraint against live DaxView</text>
  <rect x="40" y="100" width="1420" height="62" rx="8" class="banner"/><text x="60" y="126" class="note" font-weight="700">NOT A VERIFIED PHYSICAL ERD</text><text x="60" y="148" class="note">Source tables may be split across org/config/ETL structures; MCP should normalize them into these semantic entities.</text>
  <!-- relationship wires -->
  <path d="M300 270H390" class="rel" marker-end="url(#many)"/><text x="309" y="258" class="card">1</text><text x="358" y="258" class="card">0..*</text>
  <path d="M300 295H350V485H390" class="rel" marker-end="url(#many)"/><text x="307" y="315" class="card">1</text><text x="359" y="472" class="card">0..*</text>
  <path d="M640 270H730" class="rel" marker-end="url(#many)"/><text x="649" y="258" class="card">0..1</text><text x="699" y="258" class="card">0..*</text>
  <path d="M980 270H1070" class="rel" marker-end="url(#many)"/><text x="989" y="258" class="card">1</text><text x="1038" y="258" class="card">0..*</text>
  <path d="M1255 350V480" class="rel" marker-end="url(#many)"/><text x="1265" y="367" class="card">1</text><text x="1265" y="465" class="card">0..*</text>
  <path d="M640 485H730" class="rel" marker-end="url(#many)"/><text x="649" y="473" class="card">1</text><text x="699" y="473" class="card">0..*</text>
  <path d="M300 690H390" class="rel" marker-end="url(#many)"/><text x="309" y="678" class="card">1</text><text x="358" y="678" class="card">0..*</text>
  <path d="M640 690H685V545H730" class="rel" marker-end="url(#many)"/><text x="649" y="678" class="card">0..1</text><text x="690" y="560" class="card">0..*</text>
  <!-- entities -->
  <g transform="translate(50 205)"><rect width="250" height="130" rx="7" class="entity"/><path d="M0 39H250" stroke="#2578a2"/><path d="M1 7Q1 1 7 1H243Q249 1 249 7V38H1Z" class="head"/><text x="14" y="26" class="name">SITE</text><text x="14" y="62" class="field"><tspan class="key">PK</tspan> site_id</text><text x="14" y="84" class="field">name · timezone</text></g>
  <g transform="translate(390 205)"><rect width="250" height="130" rx="7" class="entity"/><path d="M0 39H250" stroke="#2578a2"/><path d="M1 7Q1 1 7 1H243Q249 1 249 7V38H1Z" class="head"/><text x="14" y="26" class="name">BUILDING</text><text x="14" y="62" class="field"><tspan class="key">PK</tspan> building_id</text><text x="14" y="84" class="field"><tspan class="key">FK</tspan> site_id · name</text></g>
  <g transform="translate(730 205)"><rect width="250" height="130" rx="7" class="entity"/><path d="M0 39H250" stroke="#2578a2"/><path d="M1 7Q1 1 7 1H243Q249 1 249 7V38H1Z" class="head"/><text x="14" y="26" class="name">FLOOR</text><text x="14" y="62" class="field"><tspan class="key">PK</tspan> floor_id</text><text x="14" y="84" class="field"><tspan class="key">FK</tspan> building_id · name</text></g>
  <g transform="translate(1070 205)"><rect width="340" height="145" rx="7" class="entity"/><path d="M0 39H340" stroke="#2578a2"/><path d="M1 7Q1 1 7 1H333Q339 1 339 7V38H1Z" class="head"/><text x="14" y="26" class="name">DEVICE</text><text x="14" y="62" class="field"><tspan class="key">PK</tspan> device_id · <tspan class="key">FK</tspan> site_id</text><text x="14" y="84" class="field"><tspan class="key">FK</tspan> floor_id (nullable)</text><text x="14" y="106" class="field">name · status · protocol</text><text x="14" y="128" class="field">last_seen</text></g>
  <g transform="translate(390 420)"><rect width="250" height="130" rx="7" class="entity"/><path d="M0 39H250" stroke="#2578a2"/><path d="M1 7Q1 1 7 1H243Q249 1 249 7V38H1Z" class="head"/><text x="14" y="26" class="name">AUTHORIZATION_GRANT</text><text x="14" y="62" class="field"><tspan class="key">PK</tspan> authorization_id</text><text x="14" y="84" class="field">principal_id · scope</text><text x="14" y="108" class="note">concept only; owned by DaxView</text></g>
  <g transform="translate(730 420)"><rect width="250" height="150" rx="7" class="entity"/><path d="M0 39H250" stroke="#2578a2"/><path d="M1 7Q1 1 7 1H243Q249 1 249 7V38H1Z" class="head"/><text x="14" y="26" class="name">DEVICE_METRIC</text><text x="14" y="62" class="field"><tspan class="key">PK</tspan> metric_id · <tspan class="key">FK</tspan> device_id</text><text x="14" y="84" class="field">canonical_name · source_name</text><text x="14" y="106" class="field">unit · value_mode · aggregation</text></g>
  <g transform="translate(1070 420)"><rect width="340" height="150" rx="7" class="entity"/><path d="M0 39H340" stroke="#2578a2"/><path d="M1 7Q1 1 7 1H333Q339 1 339 7V38H1Z" class="head"/><text x="14" y="26" class="name">TELEMETRY_READING</text><text x="14" y="62" class="field"><tspan class="key">PK</tspan> reading_id · <tspan class="key">FK</tspan> metric_id</text><text x="14" y="84" class="field">timestamp · numeric value</text><text x="14" y="108" class="note">source may be multiple ETL tables</text></g>
  <g transform="translate(390 625)"><rect width="250" height="130" rx="7" class="entity"/><path d="M0 39H250" stroke="#2578a2"/><path d="M1 7Q1 1 7 1H243Q249 1 249 7V38H1Z" class="head"/><text x="14" y="26" class="name">ALARM_EVENT</text><text x="14" y="62" class="field"><tspan class="key">PK</tspan> alarm_id · <tspan class="key">FK</tspan> site_id</text><text x="14" y="84" class="field"><tspan class="key">FK</tspan> device_id (nullable)</text><text x="14" y="106" class="field">severity · status · occurred_at</text></g>
  <text x="50" y="825" class="note">MCP should normalize raw source records into stable metric semantics: unit, interval, aggregation, value mode, timezone, coverage, and provenance.</text>
  <text x="50" y="850" class="note">Do not store authorization secrets or infer physical foreign keys from this conceptual diagram. Confirm deployed DaxView schema and tool contracts first.</text>
</svg>
