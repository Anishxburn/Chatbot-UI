<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">AI Server persistence ERD</title>
  <desc id="desc">Crow's Foot-style entity relationship diagram of the AI Server PostgreSQL conversation and knowledge tables.</desc>
  <defs>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172b3a}.title{font-size:30px;font-weight:700}.sub{font-size:15px;fill:#526675}.entity{fill:#fff;stroke:#188a8a;stroke-width:2}.head{fill:#e8f5f3}.name{font-size:17px;font-weight:700}.field{font-size:13px}.key{font-weight:700;fill:#087b78}.rel{stroke:#66808a;stroke-width:2;fill:none}.card{font-size:13px;font-weight:700;fill:#a04b26}.note{font-size:13px;fill:#526675}.cluster{fill:#f7fafb;stroke:#d3dfe4;stroke-width:1.5}.clusterTitle{font-size:17px;font-weight:700;fill:#315262}
    </style>
    <marker id="endMany" markerWidth="12" markerHeight="14" refX="10" refY="7" orient="auto"><path d="M1 1L10 7L1 13M1 7L10 7" fill="none" stroke="#66808a" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1800" height="1120" fill="#fff"/>
  <text x="40" y="48" class="title">AI Server persistence ERD</text>
  <text x="40" y="74" class="sub">PostgreSQL schema from db/init.sql · crow's foot ends annotated with cardinality · nullable FK = optional parent</text>

  <rect x="30" y="100" width="820" height="650" rx="12" class="cluster"/><text x="55" y="132" class="clusterTitle">Knowledge and chat records</text>
  <rect x="880" y="100" width="890" height="650" rx="12" class="cluster"/><text x="905" y="132" class="clusterTitle">DaxView asynchronous conversations</text>

  <!-- Relationship lines, behind entities -->
  <path d="M300 230H370" class="rel" marker-end="url(#endMany)"/><text x="311" y="218" class="card">1</text><text x="347" y="218" class="card">0..*</text>
  <path d="M300 500H345V370H370" class="rel" marker-end="url(#endMany)"/><text x="307" y="490" class="card">0..1</text><text x="347" y="359" class="card">0..*</text>
  <path d="M300 520H345V590H370" class="rel" marker-end="url(#endMany)"/><text x="307" y="541" class="card">0..1</text><text x="347" y="610" class="card">0..*</text>
  <path d="M600 590H660" class="rel" marker-end="url(#endMany)"/><text x="608" y="578" class="card">1</text><text x="637" y="578" class="card">0..*</text>
  <path d="M600 630H635V700H660" class="rel" marker-end="url(#endMany)"/><text x="605" y="648" class="card">1</text><text x="638" y="716" class="card">0..*</text>
  <path d="M1150 230H1215" class="rel" marker-end="url(#endMany)"/><text x="1158" y="218" class="card">1</text><text x="1187" y="218" class="card">0..*</text>
  <path d="M1150 270H1180V470H1215" class="rel" marker-end="url(#endMany)"/><text x="1157" y="286" class="card">1</text><text x="1185" y="457" class="card">0..*</text>
  <path d="M1450 330V400" class="rel" marker-end="url(#endMany)"/><text x="1458" y="349" class="card">1</text><text x="1458" y="389" class="card">0..1</text>
  <path d="M1510 530H1590" class="rel" marker-end="url(#endMany)"/><text x="1518" y="518" class="card">1</text><text x="1560" y="518" class="card">0..*</text>

  <!-- Entity cards -->
  <g transform="translate(60 165)"><rect width="240" height="160" rx="7" class="entity"/><path d="M0 39H240" stroke="#188a8a"/><path d="M1 7Q1 1 7 1H233Q239 1 239 7V38H1Z" class="head"/><text x="14" y="26" class="name">DOCUMENTS</text><text x="14" y="62" class="field"><tspan class="key">PK</tspan>  id · uuid</text><text x="14" y="84" class="field">title · source_type</text><text x="14" y="106" class="field">standard_name · file_name</text><text x="14" y="128" class="field">uploaded_at</text></g>
  <g transform="translate(370 165)"><rect width="250" height="180" rx="7" class="entity"/><path d="M0 39H250" stroke="#188a8a"/><path d="M1 7Q1 1 7 1H243Q249 1 249 7V38H1Z" class="head"/><text x="14" y="26" class="name">DOCUMENT_CHUNKS</text><text x="14" y="62" class="field"><tspan class="key">PK</tspan>  id · <tspan class="key">FK</tspan> document_id</text><text x="14" y="84" class="field">chunk_text · embedding</text><text x="14" y="106" class="field">page_number</text><text x="14" y="128" class="field">section_reference</text><text x="14" y="150" class="field">created_at</text></g>
  <g transform="translate(60 430)"><rect width="240" height="130" rx="7" class="entity"/><path d="M0 39H240" stroke="#188a8a"/><path d="M1 7Q1 1 7 1H233Q239 1 239 7V38H1Z" class="head"/><text x="14" y="26" class="name">CHAT_SESSIONS</text><text x="14" y="62" class="field"><tspan class="key">PK</tspan>  id · uuid</text><text x="14" y="84" class="field">user_id · nullable</text><text x="14" y="106" class="field">created_at</text></g>
  <g transform="translate(370 350)"><rect width="250" height="145" rx="7" class="entity"/><path d="M0 39H250" stroke="#188a8a"/><path d="M1 7Q1 1 7 1H243Q249 1 249 7V38H1Z" class="head"/><text x="14" y="26" class="name">CHAT_MESSAGES</text><text x="14" y="62" class="field"><tspan class="key">PK</tspan> id · <tspan class="key">FK</tspan> session_id (nullable)</text><text x="14" y="84" class="field">role · message</text><text x="14" y="106" class="field">created_at</text><text x="14" y="128" class="note">session delete sets FK null</text></g>
  <g transform="translate(370 540)"><rect width="250" height="145" rx="7" class="entity"/><path d="M0 39H250" stroke="#188a8a"/><path d="M1 7Q1 1 7 1H243Q249 1 249 7V38H1Z" class="head"/><text x="14" y="26" class="name">QA_LOGS</text><text x="14" y="62" class="field"><tspan class="key">PK</tspan> id · <tspan class="key">FK</tspan> session_id (nullable)</text><text x="14" y="84" class="field">question · answer · is_ems_related</text><text x="14" y="106" class="field">sources_used · created_at</text><text x="14" y="128" class="note">session delete sets FK null</text></g>
  <g transform="translate(660 445)"><rect width="165" height="125" rx="7" class="entity"/><path d="M0 39H165" stroke="#188a8a"/><path d="M1 7Q1 1 7 1H158Q164 1 164 7V38H1Z" class="head"/><text x="12" y="26" class="name">QA_EMBEDDINGS</text><text x="12" y="62" class="field"><tspan class="key">PK</tspan> id</text><text x="12" y="84" class="field"><tspan class="key">FK</tspan> qa_log_id</text><text x="12" y="106" class="field">question · answer · vector</text></g>
  <g transform="translate(660 645)"><rect width="165" height="100" rx="7" class="entity"/><path d="M0 39H165" stroke="#188a8a"/><path d="M1 7Q1 1 7 1H158Q164 1 164 7V38H1Z" class="head"/><text x="12" y="26" class="name">FEEDBACK</text><text x="12" y="62" class="field"><tspan class="key">PK</tspan> id · <tspan class="key">FK</tspan> qa_log_id</text><text x="12" y="84" class="field">rating · comment</text></g>

  <g transform="translate(910 165)"><rect width="240" height="165" rx="7" class="entity"/><path d="M0 39H240" stroke="#188a8a"/><path d="M1 7Q1 1 7 1H233Q239 1 239 7V38H1Z" class="head"/><text x="14" y="26" class="name">DAXVIEW_CONVERSATIONS</text><text x="14" y="62" class="field"><tspan class="key">PK</tspan> id · deployment_id</text><text x="14" y="84" class="field">company_id · user_id</text><text x="14" y="106" class="field">title · status</text><text x="14" y="128" class="field">created_at · updated_at</text><text x="14" y="150" class="field">deleted_at</text></g>
  <g transform="translate(1215 165)"><rect width="300" height="165" rx="7" class="entity"/><path d="M0 39H300" stroke="#188a8a"/><path d="M1 7Q1 1 7 1H293Q299 1 299 7V38H1Z" class="head"/><text x="14" y="26" class="name">DAXVIEW_TURNS</text><text x="14" y="62" class="field"><tspan class="key">PK</tspan> id · <tspan class="key">FK</tspan> conversation_id</text><text x="14" y="84" class="field">deployment_id · company_id · user_id</text><text x="14" y="106" class="field">user_message · request_id · context</text><text x="14" y="128" class="field">assistant_reply · resolved_plan</text><text x="14" y="150" class="field">created_at</text></g>
  <g transform="translate(1215 400)"><rect width="300" height="165" rx="7" class="entity"/><path d="M0 39H300" stroke="#188a8a"/><path d="M1 7Q1 1 7 1H293Q299 1 299 7V38H1Z" class="head"/><text x="14" y="26" class="name">DAXVIEW_JOBS</text><text x="14" y="62" class="field"><tspan class="key">PK</tspan> id · <tspan class="key">FK</tspan> turn_id, conversation_id</text><text x="14" y="84" class="field">deployment_id · company_id · user_id</text><text x="14" y="106" class="field">status</text><text x="14" y="128" class="field">created_at · updated_at</text><text x="14" y="150" class="field">cancelled_at</text></g>
  <g transform="translate(1590 400)"><rect width="165" height="125" rx="7" class="entity"/><path d="M0 39H165" stroke="#188a8a"/><path d="M1 7Q1 1 7 1H158Q164 1 164 7V38H1Z" class="head"/><text x="12" y="26" class="name">JOB_EVENTS</text><text x="12" y="62" class="field"><tspan class="key">PK/FK</tspan> job_id</text><text x="12" y="84" class="field"><tspan class="key">PK</tspan> event_id</text><text x="12" y="106" class="field">event_type · event_data</text></g>

  <rect x="50" y="790" width="1700" height="270" rx="12" fill="#eff7fa" stroke="#c9dce4"/>
  <text x="78" y="830" class="clusterTitle">Separate SQLite Prediction Lab store</text>
  <rect x="110" y="865" width="570" height="145" rx="8" class="entity"/><path d="M110 904H680" stroke="#188a8a"/><path d="M111 872Q111 866 117 866H673Q679 866 679 872V903H111Z" class="head"/><text x="132" y="892" class="name">DATASETS</text><text x="132" y="934" class="field"><tspan class="key">PK</tspan> id · payload · created_at</text>
  <rect x="1120" y="865" width="570" height="145" rx="8" class="entity"/><path d="M1120 904H1690" stroke="#188a8a"/><path d="M1121 872Q1121 866 1127 866H1683Q1689 866 1689 872V903H1121Z" class="head"/><text x="1142" y="892" class="name">RUNS</text><text x="1142" y="934" class="field"><tspan class="key">PK</tspan> id · dataset_id · payload · created_at</text><text x="1142" y="960" class="note">dataset_id is a logical reference; SQLite FK is not declared</text>
  <path d="M680 935H1120" class="rel" stroke-dasharray="8 6" marker-end="url(#endMany)"/><text x="760" y="923" class="card">1 dataset</text><text x="970" y="923" class="card">0..* runs</text>
</svg>
