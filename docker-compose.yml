services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatbot}
      POSTGRES_USER: ${POSTGRES_USER:-chatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatbot}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../AI-Server/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "${OLLAMA_HOST_PORT:-11435}:11434"
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-r1:1.5b}
      CHAT_MODEL: ${CHAT_MODEL:-qwen3:8b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull $$OLLAMA_MODEL && ollama pull $$DEEPSEEK_MODEL && ollama pull $$CHAT_MODEL && ollama pull $$EMBEDDING_MODEL"]
    restart: "no"

  chatbot-api:
    build:
      context: ../AI-Server
    image: chatbot-api:local
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    environment:
      CHATBOT_HOST: 0.0.0.0
      CHATBOT_PORT: 8000
      CHATBOT_ALLOWED_ORIGINS: http://localhost:8085,http://127.0.0.1:8085
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-r1:1.5b}
      CHAT_MODEL: ${CHAT_MODEL:-qwen3:8b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_GENERATE_TIMEOUT: ${OLLAMA_GENERATE_TIMEOUT:-120}
      OLLAMA_EMBEDDING_TIMEOUT: ${OLLAMA_EMBEDDING_TIMEOUT:-30}
      DATABASE_URL: postgresql://${POSTGRES_USER:-chatbot}:${POSTGRES_PASSWORD:-chatbot}@postgres:5432/${POSTGRES_DB:-chatbot}
      CHATBOT_TRACE_LIMIT: ${CHATBOT_TRACE_LIMIT:-200}
      AI_DEBUG_DASHBOARD_ENABLED: ${AI_DEBUG_DASHBOARD_ENABLED:-true}
      AI_PREDICTION_DATA_DIR: /app/prediction-data
      AI_PREDICTION_SOURCE_URL: ${AI_PREDICTION_SOURCE_URL:-}
      AI_PREDICTION_SOURCE_TOKEN: ${AI_PREDICTION_SOURCE_TOKEN:-}
      AI_PREDICTION_SITES_JSON: ${AI_PREDICTION_SITES_JSON:-[]}
      AI_PLANNER_ENABLED: ${AI_PLANNER_ENABLED:-false}
      AI_PLANNER_SHADOW_MODE: ${AI_PLANNER_SHADOW_MODE:-false}
      AI_CHAT_MEMORY_ENABLED: ${AI_CHAT_MEMORY_ENABLED:-false}
      PLANNER_MODEL: ${PLANNER_MODEL:-qwen3:8b}
      PLANNER_TIMEOUT: ${PLANNER_TIMEOUT:-15}
      AI_REFINE_MCP_WITH_MODEL: ${AI_REFINE_MCP_WITH_MODEL:-true}
      AI_MCP_FALLBACKS_ENABLED: ${AI_MCP_FALLBACKS_ENABLED:-true}
      AI_COMPARE_MODEL_ENABLED: ${AI_COMPARE_MODEL_ENABLED:-false}
      AI_COMPARE_MODEL: ${AI_COMPARE_MODEL:-deepseek-r1:1.5b}
      AI_COMPARE_MODELS: ${AI_COMPARE_MODELS:-}
      AI_COMPARE_MODEL_SHOW_TO_USER: ${AI_COMPARE_MODEL_SHOW_TO_USER:-false}
      AI_CHARTS_ENABLED: ${AI_CHARTS_ENABLED:-false}
      DAXVIEW_DEPLOYMENT_ID: ${DAXVIEW_DEPLOYMENT_ID:-v2-dev}
      AI_SERVER_API_KEY: ${AI_SERVER_API_KEY:-}
      AI_SERVER_API_KEY_PREVIOUS: ${AI_SERVER_API_KEY_PREVIOUS:-}
      AI_SERVER_AUDIENCE: ${AI_SERVER_AUDIENCE:-daxview-ai}
      AI_CHAT_ASSERTION_SECRET: ${AI_CHAT_ASSERTION_SECRET:-}
      AI_JOB_WORKERS: ${AI_JOB_WORKERS:-4}
      DAXVIEW_ALLOW_MISSING_COMPANY: ${DAXVIEW_ALLOW_MISSING_COMPANY:-false}
      DAXVIEW_CALLBACK_BASE_URL: ${DAXVIEW_CALLBACK_BASE_URL:-}
      DAXVIEW_CALLBACK_KEY: ${DAXVIEW_CALLBACK_KEY:-}
      DAXVIEW_CALLBACK_KEY_PREVIOUS: ${DAXVIEW_CALLBACK_KEY_PREVIOUS:-}
      DAXVIEW_MCP_ENABLED: ${DAXVIEW_MCP_ENABLED:-false}
      DAXVIEW_MCP_URL: ${DAXVIEW_MCP_URL:-https://event.daxview.com/mcp}
      DAXVIEW_MCP_AUTH_TOKEN: ${DAXVIEW_MCP_AUTH_TOKEN:-}
      DAXVIEW_MCP_TIMEOUT: ${DAXVIEW_MCP_TIMEOUT:-20}
      DAXVIEW_MCP_PROTOCOL_VERSION: ${DAXVIEW_MCP_PROTOCOL_VERSION:-2025-06-18}
      DAXVIEW_MCP_DEBUG_RESPONSE: ${DAXVIEW_MCP_DEBUG_RESPONSE:-false}
      DAXVIEW_MCP_DEBUG_RESPONSE_LIMIT: ${DAXVIEW_MCP_DEBUG_RESPONSE_LIMIT:-4000}
      DAXVIEW_API_ENABLED: ${DAXVIEW_API_ENABLED:-false}
      DAXVIEW_API_BASE_URL: ${DAXVIEW_API_BASE_URL:-https://event.daxview.com/api}
      DAXVIEW_API_AUTH_TOKEN: ${DAXVIEW_API_AUTH_TOKEN:-}
      DAXVIEW_API_SESSION_COOKIE: ${DAXVIEW_API_SESSION_COOKIE:-}
      DAXVIEW_API_USERNAME: ${DAXVIEW_API_USERNAME:-}
      DAXVIEW_API_PASSWORD: ${DAXVIEW_API_PASSWORD:-}
      DAXVIEW_API_TIMEOUT: ${DAXVIEW_API_TIMEOUT:-20}
      DAXVIEW_API_DEBUG_RESPONSE: ${DAXVIEW_API_DEBUG_RESPONSE:-false}
      DAXVIEW_API_DEBUG_RESPONSE_LIMIT: ${DAXVIEW_API_DEBUG_RESPONSE_LIMIT:-4000}
      DAXVIEW_API_ENERGY_RANKING_PATH: ${DAXVIEW_API_ENERGY_RANKING_PATH:-/core/billing/sites/{site_id}/demand/daily/}
    expose:
      - "8000"
    volumes:
      - prediction-data:/app/prediction-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  agent-poc-api:
    build:
      context: ../AI-Server
    image: chatbot-api:local
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    environment:
      CHATBOT_HOST: 0.0.0.0
      CHATBOT_PORT: 8000
      CHATBOT_ALLOWED_ORIGINS: http://localhost:8085,http://127.0.0.1:8085
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-r1:1.5b}
      CHAT_MODEL: ${CHAT_MODEL:-qwen3:8b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_GENERATE_TIMEOUT: ${OLLAMA_GENERATE_TIMEOUT:-120}
      OLLAMA_EMBEDDING_TIMEOUT: ${OLLAMA_EMBEDDING_TIMEOUT:-30}
      DATABASE_URL: postgresql://${POSTGRES_USER:-chatbot}:${POSTGRES_PASSWORD:-chatbot}@postgres:5432/${POSTGRES_DB:-chatbot}
      CHATBOT_TRACE_LIMIT: ${CHATBOT_TRACE_LIMIT:-200}
      AI_DEBUG_DASHBOARD_ENABLED: ${AI_DEBUG_DASHBOARD_ENABLED:-true}
      AI_PREDICTION_DATA_DIR: /app/prediction-data
      AI_PREDICTION_SOURCE_URL: ${AI_PREDICTION_SOURCE_URL:-}
      AI_PREDICTION_SOURCE_TOKEN: ${AI_PREDICTION_SOURCE_TOKEN:-}
      AI_PREDICTION_SITES_JSON: ${AI_PREDICTION_SITES_JSON:-[]}
      AI_PLANNER_ENABLED: ${AI_PLANNER_ENABLED:-false}
      AI_PLANNER_SHADOW_MODE: ${AI_PLANNER_SHADOW_MODE:-false}
      AI_CHAT_MEMORY_ENABLED: ${AI_CHAT_MEMORY_ENABLED:-false}
      PLANNER_MODEL: ${PLANNER_MODEL:-qwen3:8b}
      PLANNER_TIMEOUT: ${PLANNER_TIMEOUT:-15}
      AI_REFINE_MCP_WITH_MODEL: ${AI_REFINE_MCP_WITH_MODEL:-true}
      AI_MCP_FALLBACKS_ENABLED: ${AI_MCP_FALLBACKS_ENABLED:-true}
      AI_COMPARE_MODEL_ENABLED: ${AI_COMPARE_MODEL_ENABLED:-false}
      AI_COMPARE_MODEL: ${AI_COMPARE_MODEL:-deepseek-r1:1.5b}
      AI_COMPARE_MODELS: ${AI_COMPARE_MODELS:-}
      AI_COMPARE_MODEL_SHOW_TO_USER: ${AI_COMPARE_MODEL_SHOW_TO_USER:-false}
      AI_CHARTS_ENABLED: ${AI_CHARTS_ENABLED:-false}
      DAXVIEW_DEPLOYMENT_ID: ${DAXVIEW_DEPLOYMENT_ID:-v2-dev}
      AI_SERVER_API_KEY: ${AI_SERVER_API_KEY:-}
      AI_SERVER_API_KEY_PREVIOUS: ${AI_SERVER_API_KEY_PREVIOUS:-}
      AI_SERVER_AUDIENCE: ${AI_SERVER_AUDIENCE:-daxview-ai}
      AI_CHAT_ASSERTION_SECRET: ${AI_CHAT_ASSERTION_SECRET:-}
      AI_JOB_WORKERS: ${AI_JOB_WORKERS:-4}
      DAXVIEW_ALLOW_MISSING_COMPANY: ${DAXVIEW_ALLOW_MISSING_COMPANY:-false}
      DAXVIEW_CALLBACK_BASE_URL: ${DAXVIEW_CALLBACK_BASE_URL:-}
      DAXVIEW_CALLBACK_KEY: ${DAXVIEW_CALLBACK_KEY:-}
      DAXVIEW_CALLBACK_KEY_PREVIOUS: ${DAXVIEW_CALLBACK_KEY_PREVIOUS:-}
      DAXVIEW_MCP_ENABLED: ${DAXVIEW_MCP_ENABLED:-false}
      DAXVIEW_MCP_URL: ${DAXVIEW_MCP_URL:-https://event.daxview.com/mcp}
      DAXVIEW_MCP_AUTH_TOKEN: ${DAXVIEW_MCP_AUTH_TOKEN:-}
      DAXVIEW_MCP_TIMEOUT: ${DAXVIEW_MCP_TIMEOUT:-20}
      DAXVIEW_MCP_PROTOCOL_VERSION: ${DAXVIEW_MCP_PROTOCOL_VERSION:-2025-06-18}
      DAXVIEW_MCP_DEBUG_RESPONSE: ${DAXVIEW_MCP_DEBUG_RESPONSE:-false}
      DAXVIEW_MCP_DEBUG_RESPONSE_LIMIT: ${DAXVIEW_MCP_DEBUG_RESPONSE_LIMIT:-4000}
      DAXVIEW_API_ENABLED: ${DAXVIEW_API_ENABLED:-false}
      DAXVIEW_API_BASE_URL: ${DAXVIEW_API_BASE_URL:-https://event.daxview.com/api}
      DAXVIEW_API_AUTH_TOKEN: ${DAXVIEW_API_AUTH_TOKEN:-}
      DAXVIEW_API_SESSION_COOKIE: ${DAXVIEW_API_SESSION_COOKIE:-}
      DAXVIEW_API_USERNAME: ${DAXVIEW_API_USERNAME:-}
      DAXVIEW_API_PASSWORD: ${DAXVIEW_API_PASSWORD:-}
      DAXVIEW_API_TIMEOUT: ${DAXVIEW_API_TIMEOUT:-20}
      DAXVIEW_API_DEBUG_RESPONSE: ${DAXVIEW_API_DEBUG_RESPONSE:-false}
      DAXVIEW_API_DEBUG_RESPONSE_LIMIT: ${DAXVIEW_API_DEBUG_RESPONSE_LIMIT:-4000}
      DAXVIEW_API_ENERGY_RANKING_PATH: ${DAXVIEW_API_ENERGY_RANKING_PATH:-/core/billing/sites/{site_id}/demand/daily/}
    ports:
      - "${AGENT_POC_PORT:-8091}:8000"
    volumes:
      - prediction-data:/app/prediction-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  chatbot-ui:
    build:
      context: .
    image: chatbot-ui:local
    restart: unless-stopped
    depends_on:
      chatbot-api:
        condition: service_healthy
    ports:
      - "${CHATBOT_UI_PORT:-8085}:80"

volumes:
  ollama-data:
  postgres-data:
  prediction-data:
