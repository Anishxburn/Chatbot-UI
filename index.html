<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot UI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div>
          <p class="eyebrow">CHATBOT UI</p>
          <h1>Talk to your local AI service.</h1>
        </div>
        <span id="status" class="status">Checking service...</span>
      </header>

      <section id="messages" class="messages" aria-live="polite">
        <article class="message assistant">Send a message to start the conversation.</article>
      </section>

      <form id="chat-form" class="composer">
        <label class="sr-only" for="message">Message</label>
        <input id="message" name="message" autocomplete="off" placeholder="Ask something..." required />
        <button type="submit">Send</button>
      </form>
    </main>
    <script src="app.js"></script>
  </body>
</html>
